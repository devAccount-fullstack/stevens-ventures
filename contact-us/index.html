<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stevens Ventures - Contact Us</title>
    <link rel="stylesheet" href="/src/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400..900&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/Swiper/3.3.1/css/swiper.min.css">
    <style data-emotion="css" data-s=""></style>
  </head>
  <body>
    <div id="header"></div>
    <main class="contact-us">
      <div id="hero-contact"></div>
      <section class="contact-details">
        <div class="content-wrapper">
            <div class="contact-info">
                 <h2 class="no-spacing">
                  <span>Stevens</span>
                  Ventures
                </h2>
                  <p>
                    <!-- Location -->
                     <span class="icon">
                      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a2 2 0 01-2.828 0l-4.243-4.243a8 8 0 1111.314 0z"/>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
                      </svg>
                    </span>
                    <a href="https://maps.google.com/?q=717+Bridgeport+Ave+Milford,+CT+06460" target="_blank" rel="noopener">
                      717 Bridgeport Ave Milford, CT 06460
                    </a>
                  </p>

                  <p>
                    <!-- Phone -->
                    <span class="icon">
                      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.95.684l1.5 4.5a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.5 1.5A1 1 0 0121 15.72V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
                      </svg>
                    </span>
                    <a href="tel:8009007783">800.900.7783</a>
                  </p>

                  <p>
                    <!-- Email -->
                      <span class="icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l9 6 9-6m-18 8h18a2 2 0 002-2V8a2 2 0 00-2-2H3a2 2 0 00-2 2v8a2 2 0 002 2z"/>
                        </svg>
                      </span>
                    <a href="mailto:ns@stevensventures.com">ns@stevensventures.com</a>
                  </p>
            </div>
         <form class="contact-form">

          <div class="field-group">
            <label class="field-label">Name</label>
            <div class="name-row">
              <div class="input-wrap">
                <input type="text" placeholder="First Name" required>
              </div>
              <div class="input-wrap">
                <input type="text" placeholder="Last Name" required>
              </div>
            </div>
          </div>

          <div class="field-group">
            <label class="field-label">Email<span class="required-tag">(required)</span></label>
            <input type="email" required>
          </div>

          <div class="field-group">
            <label class="field-label">I'm interested in help with...<span class="required-tag">(required)</span></label>
            <div class="radio-options">
              <label class="radio-option">
                <input type="radio" name="interest" value="Local Search" required>
                Local Search
              </label>
              <label class="radio-option">
                <input type="radio" name="interest" value="Vertical SaaS">
                Vertical SaaS
              </label>
              <label class="radio-option">
                <input type="radio" name="interest" value="FinTech">
                FinTech
              </label>
              <label class="radio-option">
                <input type="radio" name="interest" value="Mobility">
                Mobility
              </label>
              <label class="radio-option">
                <input type="radio" name="interest" value="Automotive">
                Automotive
              </label>
              <label class="radio-option">
                <input type="radio" name="interest" value="SMB Marketing">
                SMB Marketing
              </label>
              <label class="radio-option">
                <input type="radio" name="interest" value="Other">
                Other
              </label>
            </div>
          </div>

          <div class="field-group">
            <label class="field-label">Additional Message<span class="optional-tag">(Optional)</span></label>
            <textarea></textarea>
          </div>

          <button type="submit" class="submit-btn btn black icon">Submit</button>

        </form>
        </div>
      </section>
       <div id="cta"></div>
    </main>
    <div id="footer"></div>
    <div id="app"></div>
    
    <script type="module" src="/src/main.js"></script>
   <script type="module" src="/src//assets/js/layout.js"></script>
  </body>
</html>
